name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0). Defaults to pubspec.yaml.'
        required: false
        type: string

permissions:
  contents: write  # for gh release create

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.47.9'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secrets configured; release will fall back to debug signing."
            exit 0
          fi
          # Gradle resolves storeFile relative to android/app/ (the module
          # dir); key.properties lives in android/ but its paths are
          # relative to the module.
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/droidedit.keystore
          {
            echo "storeFile=droidedit.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Keystore written (size: $(wc -c < android/app/droidedit.keystore) bytes)"

      - name: Resolve version
        id: ver
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            v="${{ github.ref_name }}"
          fi
          v="${v#v}"
          if [ -z "$v" ]; then
            v=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+ ]]; then
            echo "::error::resolved version '$v' doesn't look like semver" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./tool/build_apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidEdit-${{ steps.ver.outputs.version }}
          path: build/app/outputs/flutter-apk/droidEdit-${{ steps.ver.outputs.version }}.apk
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="build/app/outputs/flutter-apk/droidEdit-${{ steps.ver.outputs.version }}.apk"
          gh release create "${{ github.ref_name }}" "$apk" \
            --title "droidEdit ${{ steps.ver.outputs.version }}" \
            --generate-notes
